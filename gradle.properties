# Hyper音乐 - Gradle 全局构建参数
# 显式给 Gradle / Kotlin 守护进程都设上限：R8 与资源合并是内存峰值最高的两步，
# 不设上限时 JVM 会按机器内存自行放大，容易把整台机器拖到无响应。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.workers.max=8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
# R8 完全模式：更激进的代码优化与裁剪，缩小 dex 体积
android.enableR8.fullMode=true
# miuix 0.9.5-beta01 需要编译 SDK 37.2（minor 2），AGP 9.2.1 仅 formally 测到 37.0，抑制该提示以获得干净构建
android.suppressUnsupportedCompileSdk=37.2
